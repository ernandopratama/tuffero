# CI Tuffero: test, Pint, Larastan, dan migrasi pada MariaDB 10.6 (server dev) dan MySQL 8.4 (production, D-024).
# Belum ada CD: deploy dev lewat cPanel (.cpanel.yml), production VPS belum ada.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5' # D-039
  NODE_VERSION: '24'

jobs:
  lint:
    name: Pint + Larastan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, gd, zip, pdo_sqlite
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: Larastan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, gd, zip, pdo_sqlite
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      # Sebagian test merender view dengan @vite, jadi manifest harus ada.
      # Plugin laravel:fonts mengunduh font dari CDN saat build; timeout jaringan kadang terjadi di runner, jadi ulangi sampai 3 kali.
      - name: Build assets
        run: |
          for i in 1 2 3; do npm run build && exit 0; sleep 10; done
          exit 1

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml memakai SQLite :memory:, tanpa secret dan tanpa layanan eksternal.
      - name: Run tests
        run: php artisan test

  # Test memakai SQLite, tetapi dev berjalan di MariaDB dan production di MySQL: perbedaan sintaks (mis. TIMESTAMP tanpa default) baru ketahuan saat deploy.
  migrate:
    name: Migrate (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: ['mariadb:10.6', 'mysql:8.4']
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tuffero
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: tuffero
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, intl, gd, zip, pdo_mysql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate and seed
        run: |
          php artisan migrate --force
          php artisan db:seed --force
